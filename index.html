<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LAKI_SIGNAL</title>

<style>

body{
    background:black;
    color:white;
    text-align:center;
    font-family:Arial;
    margin-top:100px;
}

button{
    font-size:30px;
    padding:20px;
}

#status{
    margin-top:50px;
    font-size:30px;
}

</style>
</head>

<body>

<h1>LAKI_SIGNAL</h1>

<button onclick="startBLE()">
START
</button>

<div id="status">
WAITING...
</div>

<script>

async function startBLE(){

    try{

        const device =
        await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              "4fafc201-1fb5-459e-8fcc-c5c9c331914b"
            ]
        });

        document.body.style.background = "purple";

        document.getElementById("status").innerHTML =
        "CONNECTED : " + device.name;

    }

    catch(error){

        document.body.style.background = "darkred";

        document.getElementById("status").innerHTML =
        error;

    }

}

</script>

</body>
</html>
